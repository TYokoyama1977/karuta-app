<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>カード PDF ビューア</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      padding: 0;
      text-align: center;
      background: #f7f7f7;
      font-family: "Arial", sans-serif;
    }

    .no-print {
      margin: 10px;
    }

    @media print {
      .no-print {
        display: none;
      }
      body {
        margin: 0;
        padding: 0;
      }
    }

    iframe {
      width: 100%;
      height: 95vh;
      border: none;
    }
  </style>
</head>

<body>

  <button class="no-print" onclick="history.back()">← 戻る</button>

  <iframe id="pdfFrame" src=""></iframe>

  <script>
    // URLのパラメータ (?category=xxx) からジャンル名を取得
    const params = new URLSearchParams(window.location.search);
    const category = params.get('category') || 'animal';

    // ジャンル名に応じたPDFファイル名を動的に設定 (例: animal.pdf, color.pdf など)
    const pdfFileName = `${category}.pdf`;

    // 画面タイトルと iframe の src を切り替え
    document.title = `${category.toUpperCase()} カード PDF`;
    document.getElementById('pdfFrame').src = `pdf/${pdfFileName}`;
  </script>

</body>
</html>
