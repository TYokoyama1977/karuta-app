<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文章漢字 手書きクイズゲーム</title>
<style>
  body {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    text-align: center;
    margin: 0;
    padding: 15px;
    background-color: #f4f7f6;
    color: #333;
  }

  /* 進捗＆全体ステータス */
  #header-info {
    max-width: 450px;
    margin: 0 auto 10px auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    color: #555;
  }
  .check-reset-btn {
    font-size: 12px;
    padding: 4px 8px;
    background-color: #dc3545;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
  .check-reset-btn:hover { background-color: #c82333; }

  /* 問題表示エリア */
  #question-box {
    background-color: #fff;
    padding: 15px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    max-width: 450px;
    margin: 0 auto 15px auto;
    position: relative;
  }
  .q-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .q-label { font-size: 13px; color: #666; font-weight: bold; }
  
  /* チェックマーク表示エリア */
  .check-marks {
    display: flex;
    gap: 4px;
  }
  .check-badge {
    display: inline-block;
    width: 20px;
    height: 20px;
    line-height: 20px;
    border-radius: 50%;
    background-color: #e0e0e0;
    color: #fff;
    font-size: 12px;
    font-weight: bold;
  }
  .check-badge.active {
    background-color: #28a745;
  }

  /* 文章と読みのスタイル */
  #question-sentence {
    font-size: 20px;
    font-weight: bold;
    color: #2c3e50;
    margin-bottom: 8px;
    line-height: 1.4;
    word-break: break-all;
  }
  /* 問題文中のひらがな強調部分 */
  .target-reading {
    color: #007bff;
    text-decoration: underline;
    font-weight: bold;
    padding: 0 2px;
  }
  #question-hiragana {
    font-size: 14px;
    color: #666;
  }

  /* 入力マス目コンテナ（文字数に応じて可変） */
  #word-container {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 15px;
    flex-wrap: wrap;
  }
  .char-box {
    width: 50px;
    height: 50px;
    border: 2px solid #ccc;
    border-radius: 8px;
    background-color: #fff;
    font-size: 30px;
    font-weight: bold;
    line-height: 50px;
    cursor: pointer;
    user-select: none;
    transition: all 0.2s;
  }
  .char-box.active {
    border-color: #007bff;
    box-shadow: 0 0 8px rgba(0, 123, 255, 0.4);
    background-color: #eef6ff;
  }

  /* キャンバス */
  #canvas {
    border: 2px solid #333;
    border-radius: 6px;
    background-color: #ffffff;
    touch-action: none;
    cursor: crosshair;
  }

  .controls { margin: 10px 0; }
  button {
    padding: 8px 14px;
    font-size: 14px;
    margin: 0 3px;
    cursor: pointer;
    border: 1px solid #ccc;
    border-radius: 5px;
    background-color: #fff;
    transition: 0.2s;
  }
  button:hover { background-color: #e6e6e6; }
  .btn-next {
    background-color: #007bff;
    color: white;
    border: none;
    font-weight: bold;
    padding: 8px 16px;
    font-size: 14px;
  }
  .btn-next:hover { background-color: #0056b3; }

  /* 候補領域 */
  #result-box { margin-top: 5px; }
  .candidate-list {
    display: flex;
    justify-content: center;
    gap: 8px;
    min-height: 45px;
    margin-top: 5px;
  }
  .candidate {
    display: inline-block;
    width: 42px;
    height: 42px;
    line-height: 42px;
    font-size: 22px;
    border: 1px solid #007bff;
    border-radius: 6px;
    background-color: #fff;
    color: #007bff;
    cursor: pointer;
    user-select: none;
    font-weight: bold;
  }
  .candidate:hover {
    background-color: #007bff;
    color: #fff;
  }

  /* 判定結果・解説領域 */
  #judgement-box {
    max-width: 450px;
    margin: 15px auto 0 auto;
    padding: 10px;
    border-radius: 8px;
  }
  .correct {
    background-color: #d4edda;
    color: #155724;
    border: 1px solid #c3e6cb;
  }
  .incorrect {
    background-color: #f8d7da;
    color: #721c24;
    border: 1px solid #f5c6cb;
  }
  #result-status { font-size: 20px; font-weight: bold; }
  #result-meaning { font-size: 14px; margin-top: 5px; text-align: left; }

  /* 結果発表画面 */
  #session-result {
    display: none;
    background: #fff;
    max-width: 450px;
    margin: 20px auto;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  #session-result h3 { margin-top: 0; color: #007bff; }
  .score-display { font-size: 28px; font-weight: bold; margin: 15px 0; }
</style>
</head>
<body>

<h2>文章漢字 手書きクイズ</h2>

<!-- 全体ステータス ＆ チェックリセット -->
<div id="header-info">
  <span id="session-progress">第 1 / 10 問</span>
  <button id="resetChecksBtn" class="check-reset-btn">全チェック消去</button>
</div>

<!-- クイズ領域 -->
<div id="quiz-area">
  <!-- 問題表示 -->
  <div id="question-box">
    <div class="q-header">
      <span class="q-label">【問題】太字・下線の部分を漢字にしなさい</span>
      <div class="check-marks">
        <span id="check1" class="check-badge">✓</span>
        <span id="check2" class="check-badge">✓</span>
      </div>
    </div>
    <!-- 文章と読みの表示部 -->
    <div id="question-sentence">読み込み中...</div>
    <div id="question-hiragana"></div>
  </div>

  <!-- 可変マス目入力エリア -->
  <div id="word-container"></div>

  <!-- 手書きキャンバス -->
  <canvas id="canvas" width="280" height="280"></canvas>

  <div class="controls">
    <button id="clearBtn">一画消去</button>
    <button id="backspaceBtn">1文字削除</button>
    <button id="nextBtn" class="btn-next">次の問題 ➔</button>
  </div>

  <!-- 漢字候補 -->
  <div id="result-box">
    <div style="font-size: 13px; color: #666;">候補（タップで選択）:</div>
    <div id="candidates" class="candidate-list"></div>
  </div>

  <!-- 判定・解説 -->
  <div id="judgement-box" style="display:none;">
    <div id="result-status"></div>
    <div id="result-meaning"></div>
  </div>
</div>

<!-- 10問完了時の結果画面 -->
<div id="session-result">
  <h3>🎉 セッション終了！</h3>
  <p>10問のクイズが完了しました。</p>
  <div class="score-display">
    正解数: <span id="correct-count">0</span> / 10<br>
    スコア: <span id="score-val">0</span> 点
  </div>
  <button id="restartBtn" class="btn-next" style="padding: 10px 20px; font-size: 16px; background-color: #28a745;">次の10問に挑戦 ➔</button>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const wordContainer = document.getElementById("word-container");

let database = [];          // CSV問題データ
let checkMap = {};          // { 問題ID/漢字: 正解回数(0,1,2) }
let availablePool = [];     // 2回正解していない出題可能問題リスト

// セッション管理（10問単位）
let currentSessionQuestions = [];
let sessionIndex = 0;
let sessionCorrectCount = 0;
let currentQuiz = null;

let currentIndex = 0;
let targetLength = 0;       // 正解漢字の文字数
let strokes = [];
let currentStrokeX = [];
let currentStrokeY = [];
let drawing = false;
let recognizeTimer = null;

// ストレージからチェック状態を読み込み
function loadCheckData() {
  const data = localStorage.getItem("sentence_kanji_check_map");
  checkMap = data ? JSON.parse(data) : {};
}

// チェック状態の保存
function saveCheckData() {
  localStorage.setItem("sentence_kanji_check_map", JSON.stringify(checkMap));
}

// CSV読み込み
async function loadCSV() {
  try {
    // 文章問題用のCSVファイル名
    const response = await fetch('bunshou_kanji.csv');
    const text = await response.text();
    const lines = text.split(/\r\n|\n/);
    database = [];
    
    for (let i = 1; i < lines.length; i++) {
      const line = lines[i].trim();
      if (!line) continue;
      
      // カンマ区切りのパース（簡易版）
      const cols = line.split(',');
      if (cols.length >= 4) {
        database.push({
          id: cols[0].trim(),
          kanji: cols[1].trim(),
          hiragana: cols[2].trim(),
          sentence: cols[3].trim(),
          meaning: cols[4] ? cols[4].trim() : ""
        });
      }
    }

    loadCheckData();
    startNewSession();
  } catch (error) {
    console.error("CSV読み込みエラー:", error);
    document.getElementById("question-sentence").textContent = "CSVの読み込みに失敗しました (bunshou_kanji.csv)";
  }
}

// 10問のセッションを開始
function startNewSession() {
  availablePool = database.filter(q => {
    const count = checkMap[q.id || q.kanji] || 0;
    return count < 2;
  });

  if (availablePool.length === 0) {
    alert("すべての問題をクリア（2回正解）しました！全チェックを初期化します。");
    checkMap = {};
    saveCheckData();
    availablePool = [...database];
  }

  const shuffled = [...availablePool].sort(() => Math.random() - 0.5);
  currentSessionQuestions = shuffled.slice(0, 10);
  sessionIndex = 0;
  sessionCorrectCount = 0;

  document.getElementById("quiz-area").style.display = "block";
  document.getElementById("session-result").style.display = "none";

  loadQuestion();
}

// 各問題のセットアップ
function loadQuestion() {
  currentQuiz = currentSessionQuestions[sessionIndex];

  // ヘッダー情報更新
  document.getElementById("session-progress").textContent = `第 ${sessionIndex + 1} / ${currentSessionQuestions.length} 問`;

  // 文章内のひらがな（または【読み】）を強調HTMLに変換表示
  let formattedSentence = currentQuiz.sentence;
  if (formattedSentence.includes(currentQuiz.hiragana)) {
    formattedSentence = formattedSentence.replace(
      currentQuiz.hiragana, 
      `<span class="target-reading">${currentQuiz.hiragana}</span>`
    );
  }
  document.getElementById("question-sentence").innerHTML = formattedSentence;
  document.getElementById("question-hiragana").textContent = `読み: ${currentQuiz.hiragana} (${currentQuiz.kanji.length}文字)`;

  // チェックランプの更新
  const qKey = currentQuiz.id || currentQuiz.kanji;
  const checks = checkMap[qKey] || 0;
  document.getElementById("check1").classList.toggle("active", checks >= 1);
  document.getElementById("check2").classList.toggle("active", checks >= 2);

  // マス目の動的生成（正解の文字数に合わせる）
  targetLength = currentQuiz.kanji.length;
  createCharBoxes(targetLength);

  // 画面リセット
  document.getElementById("judgement-box").style.display = "none";
  setActiveBox(0);
  initCanvas();
}

// 文字数に応じたマス目生成
function createCharBoxes(length) {
  wordContainer.innerHTML = "";
  for (let i = 0; i < length; i++) {
    const box = document.createElement("div");
    box.className = "char-box";
    box.dataset.index = i;
    box.addEventListener("click", () => setActiveBox(i));
    wordContainer.appendChild(box);
  }
}

function getBoxes() {
  return document.querySelectorAll(".char-box");
}

// キャンバス初期化
function initCanvas() {
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = "#f0f0f0";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(canvas.width / 2, 0); ctx.lineTo(canvas.width / 2, canvas.height);
  ctx.moveTo(0, canvas.height / 2); ctx.lineTo(canvas.width, canvas.height / 2);
  ctx.stroke();

  strokes = [];
  document.getElementById("candidates").innerHTML = "";
}

// マス目のアクティブ設定
function setActiveBox(index) {
  if (index < 0) index = 0;
  if (index >= targetLength) index = targetLength - 1;
  currentIndex = index;

  const boxes = getBoxes();
  boxes.forEach((box, i) => {
    box.classList.toggle("active", i === currentIndex);
  });
}

// 手書き入力処理
function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return { x: clientX - rect.left, y: clientY - rect.top };
}

function startDrawing(e) {
  e.preventDefault();
  drawing = true;
  clearTimeout(recognizeTimer);
  const pos = getPos(e);
  currentStrokeX = [pos.x]; currentStrokeY = [pos.y];
  ctx.beginPath(); ctx.moveTo(pos.x, pos.y);
}

function draw(e) {
  if (!drawing) return;
  e.preventDefault();
  const pos = getPos(e);
  currentStrokeX.push(pos.x); currentStrokeY.push(pos.y);
  ctx.lineTo(pos.x, pos.y);
  ctx.strokeStyle = "#000000"; ctx.lineWidth = 5;
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.stroke();
}

function stopDrawing(e) {
  if (!drawing) return;
  drawing = false;
  if (currentStrokeX.length > 0) {
    strokes.push([currentStrokeX, currentStrokeY]);
  }
  recognizeTimer = setTimeout(recognizeKanji, 600);
}

canvas.addEventListener("mousedown", startDrawing);
canvas.addEventListener("mousemove", draw);
canvas.addEventListener("mouseup", stopDrawing);
canvas.addEventListener("mouseleave", stopDrawing);
canvas.addEventListener("touchstart", startDrawing, { passive: false });
canvas.addEventListener("touchmove", draw, { passive: false });
canvas.addEventListener("touchend", stopDrawing);

document.getElementById("clearBtn").addEventListener("click", initCanvas);
document.getElementById("backspaceBtn").addEventListener("click", () => {
  const boxes = getBoxes();
  if (boxes[currentIndex].textContent !== "") {
    boxes[currentIndex].textContent = "";
  } else if (currentIndex > 0) {
    setActiveBox(currentIndex - 1);
    boxes[currentIndex].textContent = "";
  }
  checkAnswer();
});

// 「次の問題」ボタン
document.getElementById("nextBtn").addEventListener("click", () => {
  sessionIndex++;
  if (sessionIndex < currentSessionQuestions.length) {
    loadQuestion();
  } else {
    showSessionResult();
  }
});

// 全チェックリセット
document.getElementById("resetChecksBtn").addEventListener("click", () => {
  if (confirm("これまでの正解（チェック）履歴をすべて消去しますか？")) {
    checkMap = {};
    saveCheckData();
    alert("チェックをクリアしました。新しい問題を開始します。");
    startNewSession();
  }
});

document.getElementById("restartBtn").addEventListener("click", startNewSession);

// Google 手書き認識 API
async function recognizeKanji() {
  if (strokes.length === 0) return;

  const requestData = {
    options: "enable_homophone_disambiguation",
    requests: [{
      writing_guide: { writing_area_width: canvas.width, writing_area_height: canvas.height },
      ink: strokes, language: "ja"
    }]
  };

  try {
    const response = await fetch("https://www.google.com/inputtools/request?ime=handwriting&app=mobilesearch&cs=1&oe=UTF-8", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(requestData)
    });
    const data = await response.json();
    if (data[0] === "SUCCESS") {
      displayCandidates(data[1][0][1]);
    }
  } catch (error) {
    console.error("認識エラー:", error);
  }
}

function isKanji(ch) {
  return /^[\u4E00-\u9FFF\u3400-\u4DBF]+$/.test(ch);
}

function displayCandidates(candidates) {
  const container = document.getElementById("candidates");
  container.innerHTML = "";

  let kanjiCandidates = candidates.filter(char => isKanji(char));
  if (kanjiCandidates.length === 0) kanjiCandidates = candidates;

  kanjiCandidates.slice(0, 5).forEach(char => {
    const btn = document.createElement("div");
    btn.className = "candidate";
    btn.textContent = char;
    btn.onclick = () => selectCharacter(char);
    container.appendChild(btn);
  });
}

function selectCharacter(char) {
  const boxes = getBoxes();
  boxes[currentIndex].textContent = char;
  initCanvas();

  if (currentIndex < targetLength - 1) {
    setActiveBox(currentIndex + 1);
  }

  checkAnswer();
}

// 正誤判定処理
function checkAnswer() {
  const boxes = getBoxes();
  const userWord = Array.from(boxes).map(box => box.textContent).join("");
  
  if (userWord.length === targetLength) {
    const jBox = document.getElementById("judgement-box");
    const statusEl = document.getElementById("result-status");
    const meaningEl = document.getElementById("result-meaning");

    jBox.style.display = "block";
    const qKey = currentQuiz.id || currentQuiz.kanji;

    if (userWord === currentQuiz.kanji) {
      jBox.className = "correct";
      statusEl.textContent = "🎉 正解！";
      sessionCorrectCount++;

      // チェックを加算 (最大2)
      let currentChecks = checkMap[qKey] || 0;
      if (currentChecks < 2) {
        checkMap[qKey] = currentChecks + 1;
        saveCheckData();
      }

      // ランプを更新
      const newChecks = checkMap[qKey];
      document.getElementById("check1").classList.toggle("active", newChecks >= 1);
      document.getElementById("check2").classList.toggle("active", newChecks >= 2);

    } else {
      jBox.className = "incorrect";
      statusEl.textContent = `❌ 不正解... (正解: ${currentQuiz.kanji})`;
    }

    meaningEl.textContent = currentQuiz.meaning ? `【解説】${currentQuiz.meaning}` : "";
  }
}

// 10問終了後のセッション結果表示
function showSessionResult() {
  document.getElementById("quiz-area").style.display = "none";
  document.getElementById("session-result").style.display = "block";

  const total = currentSessionQuestions.length;
  const score = Math.round((sessionCorrectCount / total) * 100);

  document.getElementById("correct-count").textContent = sessionCorrectCount;
  document.getElementById("score-val").textContent = score;
}

// 起動処理
loadCSV();
</script>

</body>
</html>
