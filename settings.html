<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>設定 - 英語かるたアプリ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: "Arial", sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    /* play.html と統一したヘッダー */
    .header {
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
      border-bottom: 1px solid #ddd;
    }

    .nav-btn {
      font-size: 18px;
      padding: 10px 18px;
      border-radius: 10px;
      border: none;
      background: #e6e6e6;
      cursor: pointer;
    }

    .nav-btn:hover {
      background: #dcdcdc;
    }

    .setting-card {
      background: #fff;
      width: 90%;
      max-width: 500px;
      margin: 20px auto;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      text-align: left;
    }

    .setting-row {
      margin-bottom: 25px;
      font-size: 20px;
    }

    /* ▼ ▲ ボタンを押しやすくする */
    .interval-btn {
      font-size: 28px;
      padding: 10px 20px;
      border-radius: 10px;
      background: #eee;
      border: none;
      cursor: pointer;
    }

    .interval-btn:active {
      background: #ddd;
    }

    #intervalDisplay {
      font-size: 32px;
      width: 70px;
      display: inline-block;
      text-align: center;
    }

    .save-btn {
      margin-top: 20px;
      padding: 15px 40px;
      font-size: 22px;
      border-radius: 50px;
      border: none;
      background: #66ccff;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <!-- play.html と同じ2ボタン構成 -->
  <div class="header">
    <button id="homeButton" class="nav-btn">🏠 ホーム</button>
    <button id="playButton" class="nav-btn">🔊 読み上げ</button>
  </div>

  <h2>設定</h2>

  <div class="setting-card">

    <div class="setting-row">
      <label>
        <input type="checkbox" id="autoPlayCheck">
        自動再生
      </label>
    </div>

    <div class="setting-row">
      声：
      <label><input type="radio" name="voice" value="boy"> 男性</label>
      <label><input type="radio" name="voice" value="girl"> 女性</label>
    </div>

    <!-- ▼ ▲ ボタン方式に変更 -->
    <div class="setting-row">
      間隔（秒）：

      <div style="display:flex; justify-content:center; align-items:center; gap:20px; margin-top:10px;">
        <button id="intervalDown" class="interval-btn">▼</button>

        <span id="intervalDisplay">6</span>

        <button id="intervalUp" class="interval-btn">▲</button>
      </div>
    </div>

    <button id="saveBtn" class="save-btn">保存する</button>
  </div>

  <script>
    /* play.html と同じ遷移先に統一 */
    homeButton.addEventListener("click", () => {
      window.location.href = "index.html";
    });

    playButton.addEventListener("click", () => {
      window.location.href = "play.html";
    });

    const settings = JSON.parse(localStorage.getItem("settings") || "{}");

    /* 自動再生 */
    autoPlayCheck.checked = settings.autoPlay || false;

    /* 声の設定 */
    if (settings.voice === "girl") {
      document.querySelector('input[value="girl"]').checked = true;
    } else {
      document.querySelector('input[value="boy"]').checked = true;
    }

    /* 間隔（秒） 初期値 */
    let intervalValue = settings.interval || 6;
    const intervalDisplay = document.getElementById("intervalDisplay");
    intervalDisplay.textContent = intervalValue;

    /* ▼ ボタン（減らす） */
    document.getElementById("intervalDown").addEventListener("click", () => {
      if (intervalValue > 1) intervalValue--;
      intervalDisplay.textContent = intervalValue;
    });

    /* ▲ ボタン（増やす） */
    document.getElementById("intervalUp").addEventListener("click", () => {
      if (intervalValue < 20) intervalValue++;
      intervalDisplay.textContent = intervalValue;
    });

    /* 保存 */
    saveBtn.addEventListener("click", () => {
      const newSettings = {
        autoPlay: autoPlayCheck.checked,
        voice: document.querySelector('input[name="voice"]:checked').value,
        interval: intervalValue
      };

      localStorage.setItem("settings", JSON.stringify(newSettings));

      alert("設定を保存しました");
    });
  </script>

</body>
</html>
