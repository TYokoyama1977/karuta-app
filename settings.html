<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>設定 - 英語かるたアプリ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: "Arial", sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    .header {
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
      border-bottom: 1px solid #ddd;
    }

    .nav-btn {
      font-size: 18px;
      padding: 10px 18px;
      border-radius: 10px;
      border: none;
      background: #e6e6e6;
      cursor: pointer;
    }

    .nav-btn:hover {
      background: #dcdcdc;
    }

    .setting-card {
      background: #fff;
      width: 90%;
      max-width: 500px;
      margin: 20px auto;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      text-align: left;
    }

    .setting-row {
      margin-bottom: 25px;
      font-size: 20px;
    }

    .btn-group {
      display: flex;
      gap: 15px;
      margin-top: 10px;
    }

    .btn-option {
      flex: 1;
      padding: 12px 0;
      font-size: 20px;
      border-radius: 10px;
      border: none;
      background: #eee;
      cursor: pointer;
      text-align: center;
    }

    .btn-option.selected {
      background: #ffcc66;
      border: 2px solid #ff9900;
    }

    .interval-btn {
      font-size: 22px;
      padding: 10px 20px;
      border-radius: 10px;
      background: #eee;
      border: none;
      cursor: pointer;
    }

    #intervalDisplay {
      font-size: 26px;
      width: 70px;
      display: inline-block;
      text-align: center;
    }

    .save-btn {
      margin-top: 20px;
      padding: 15px 40px;
      font-size: 22px;
      border-radius: 50px;
      border: none;
      background: #66ccff;
      cursor: pointer;
    }

    .delete-btn {
      margin-top: 15px;
      padding: 15px 40px;
      font-size: 22px;
      border-radius: 50px;
      border: none;
      background: #ff6666;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="header">
    <button id="homeButton" class="nav-btn">🏠 ホーム</button>
    <button id="myWordsButton" class="nav-btn">📚 マイ単語読み上げ</button>
    <button id="playButton" class="nav-btn">🔊 ジャンル読み上げ</button>
  </div>

  <h2>設定</h2>

  <div class="setting-card">

    <!-- 声 -->
    <div class="setting-row">
      声
      <div class="btn-group">
        <button id="voiceBoy" class="btn-option">男性</button>
        <button id="voiceGirl" class="btn-option">女性</button>
      </div>
    </div>

    <!-- 自動再生 -->
    <div class="setting-row">
      自動再生
      <div class="btn-group">
        <button id="autoOn" class="btn-option">ON</button>
        <button id="autoOff" class="btn-option">OFF</button>
      </div>
    </div>

    <!-- 間隔 -->
    <div class="setting-row">
      間隔（秒）
      <div style="display:flex; justify-content:center; align-items:center; gap:20px; margin-top:10px;">
        <button id="intervalDown" class="interval-btn">▼</button>
        <span id="intervalDisplay">6</span>
        <button id="intervalUp" class="interval-btn">▲</button>
      </div>
    </div>

    <!-- マイ単語の登録単語 -->
    <div class="setting-row">
      マイ単語の登録単語
    </div>

    <button id="saveBtn" class="save-btn">保存する</button>

    <!-- 全て消去ボタン（保存の直下） -->
    <button id="deleteWordsBtn" class="delete-btn">全て消去</button>

  </div>

  <script>
    homeButton.addEventListener("click", () => {
      window.location.href = "index.html";
    });

    myWordsButton.addEventListener("click", () => {
      window.location.href = "user-words.html";
    });

    playButton.addEventListener("click", () => {
      window.location.href = "play.html";
    });

    const settings = JSON.parse(localStorage.getItem("settings") || "{}");

    let autoPlay = settings.autoPlay || false;
    let voice = settings.voice || "boy";
    let intervalValue = settings.interval || 6;

    const autoOn = document.getElementById("autoOn");
    const autoOff = document.getElementById("autoOff");
    const voiceBoy = document.getElementById("voiceBoy");
    const voiceGirl = document.getElementById("voiceGirl");
    const intervalDisplay = document.getElementById("intervalDisplay");

    function updateUI() {
      autoOn.classList.toggle("selected", autoPlay);
      autoOff.classList.toggle("selected", !autoPlay);
      voiceBoy.classList.toggle("selected", voice === "boy");
      voiceGirl.classList.toggle("selected", voice === "girl");
      intervalDisplay.textContent = intervalValue;
    }

    autoOn.onclick = () => { autoPlay = true; updateUI(); };
    autoOff.onclick = () => { autoPlay = false; updateUI(); };
    voiceBoy.onclick = () => { voice = "boy"; updateUI(); };
    voiceGirl.onclick = () => { voice = "girl"; updateUI(); };

    intervalDown.addEventListener("click", () => {
      if (intervalValue > 1) intervalValue--;
      updateUI();
    });

    intervalUp.addEventListener("click", () => {
      if (intervalValue < 20) intervalValue++;
      updateUI();
    });

    saveBtn.addEventListener("click", () => {
      const newSettings = {
        autoPlay: autoPlay,
        voice: voice,
        interval: intervalValue
      };

      localStorage.setItem("settings", JSON.stringify(newSettings));
      alert("設定を保存しました");
    });

    deleteWordsBtn.addEventListener("click", () => {
      if (confirm("登録した単語をすべて消去しますか？")) {
        localStorage.removeItem("userWords");
        alert("登録単語を消去しました");
      }
    });

    updateUI();
  </script>

</body>
</html>
