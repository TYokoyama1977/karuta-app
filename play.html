<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>読み上げ - 英語かるたアプリ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: "Arial", sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    .play-header {
      padding: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fff;
      border-bottom: 1px solid #ddd;
      gap: 20px;
    }

    .home-btn, .edit-btn, .setting-btn {
      font-size: 18px;
      padding: 8px 14px;
      border-radius: 8px;
      border: none;
      background: #eee;
      cursor: pointer;
    }

    h2 {
      margin-top: 10px;
      font-size: 20px;
      color: #444;
    }

    .genre-icons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin-top: 10px;
    }

    .genre {
      width: 100px;
      text-align: center;
      cursor: pointer;
      padding: 5px;
      border-radius: 10px;
      transition: 0.2s;
      background: #fff;
      border: 1px solid #ddd;
    }

    .genre img {
      width: 70px;
      height: 70px;
    }

    .genre.selected {
      border: 3px solid #ffcc33;
      background: #fff7cc;
    }

    .genre input[type="checkbox"] {
      margin-top: 5px;
      transform: scale(1.3);
    }

    .reading-card {
      background: #fff;
      width: 90%;
      max-width: 500px;
      margin: 20px auto;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    #currentWord {
      font-size: 80px;
      margin-top: 10px;
      color: #333;
    }

    .main-btn {
      margin-top: 15px;
      padding: 18px 40px;
      font-size: 22px;
      border-radius: 50px;
      border: none;
      background: #ffcc66;
      cursor: pointer;
    }

    .main-btn:hover {
      background: #ffdd88;
    }

    .top-btn {
      font-size: 18px;
      padding: 8px 14px;
      border-radius: 8px;
      border: none;
      background: #eee;
      margin: 5px;
      cursor: pointer;
    }

    #remainingCount {
      font-size: 22px;
      color: #444;
    }

    #autoPlayStatus {
      font-size: 20px;
      margin-top: 5px;
      color: #666;
    }

    footer {
      margin-top: 20px;
      padding: 10px;
      font-size: 14px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="play-header">
    <button id="homeButton" class="home-btn">🏠 ホーム</button>
    <button id="editButton" class="edit-btn">✏️ 単語一覧</button>
    <button id="settingButton" class="setting-btn">🔧 設定</button>
  </div>

  <h2>ジャンルを選択してください</h2>

  <div class="genre-icons" id="genreArea"></div>

  <div style="margin-top:10px;">
    <button id="checkAllBtn" class="top-btn">全ジャンルチェック</button>
    <button id="clearCheckBtn" class="top-btn">チェッククリア</button>
  </div>

  <div class="reading-card">

    <div style="display:flex; justify-content:center; align-items:center; gap:15px;">
      <div id="currentWord">---</div>
      <button id="toggleWordBtn" class="top-btn">👁 表示</button>
    </div>

    <p id="autoPlayStatus">自動再生：OFF</p>

    <div style="display:flex; justify-content:center; margin-top:10px;">
      <p id="remainingCount">残り：0</p>
    </div>

    <!-- ★ カウントダウン表示 -->
    <p id="countdownMessage" style="font-size:24px; color:#555; margin-top:10px;"></p>

    <button id="startBtn" class="main-btn" style="background:#99ddff;">▶ 読む</button>
    <button id="pauseButton" class="main-btn" style="background:#ff9999;">⏹ 停止</button>
    <button id="shuffleResetBtn" class="main-btn" style="background:#ffcc66;">🔄 シャッフル</button>

  </div>

  <footer>
    © 2026 Studio OZ
  </footer>

  <script>
    /* 固定60語 */
    const wordsData = {
      Animal: ["dog","cat","bird","fish","rabbit","bear","lion","horse","elephant","zebra"],
      Color: ["red","blue","yellow","green","black","white","pink","purple","brown","gray"],
      Food: ["bread","rice","milk","egg","soup","cake","cheese","juice","hamburger","cookie"],
      Fruit: ["apple","banana","orange","grape","peach","lemon","melon","strawberry","kiwi","watermelon"],
      Body: ["head","hand","foot","eye","ear","nose","mouth","hair","elbow","knee"],
      Other: ["car","house","book","chair","clock","cup","ball","star","table","chopsticks"]
    };

    /* 画面遷移 */
    homeButton.addEventListener("click", () => window.location.href = "index.html");
    editButton.addEventListener("click", () => window.location.href = "edit.html");
    settingButton.addEventListener("click", () => window.location.href = "settings.html");

    /* 設定 */
    const settings = JSON.parse(localStorage.getItem("settings") || "{}");
    const readInterval = settings.interval || 6;
    let autoPlay = settings.autoPlay || false;

    autoPlayStatus.textContent = "自動再生：" + (autoPlay ? "ON" : "OFF");

    /* ジャンル生成 */
    const genres = ["Animal", "Color", "Food", "Fruit", "Body", "Other"];
    const genreArea = document.getElementById("genreArea");

    genres.forEach(g => {
      const div = document.createElement("div");
      div.className = "genre";
      div.dataset.genre = g;

      div.innerHTML = `
        <img src="images/${g.toLowerCase()}_icon.png">
        <p>${g}</p>
        <input type="checkbox">
      `;

      div.addEventListener("click", (e) => {
        const cb = div.querySelector("input");
        if (e.target.tagName !== "INPUT") cb.checked = !cb.checked;
        div.classList.toggle("selected", cb.checked);
        loadWords();
      });

      genreArea.appendChild(div);
    });

    checkAllBtn.addEventListener("click", () => {
      document.querySelectorAll(".genre").forEach(g => {
        const cb = g.querySelector("input");
        cb.checked = true;
        g.classList.add("selected");
      });
      loadWords();
    });

    clearCheckBtn.addEventListener("click", () => {
      document.querySelectorAll(".genre").forEach(g => {
        const cb = g.querySelector("input");
        cb.checked = false;
        g.classList.remove("selected");
      });
      loadWords();
    });

    /* 読み上げ変数 */
    let words = [];
    let shuffled = [];
    let index = 0;

    let audioPlayer = null;
    let isPlaying = false;
    let isPaused = false;

    let autoPlayTimer = null;
    let startDelayTimer = null;

    /* ★ カウントダウン用 */
    let countdownTimer = null;

    /* 単語読み込み */
    function loadWords() {
      words = [];
      document.querySelectorAll(".genre").forEach(g => {
        const cb = g.querySelector("input");
        if (cb.checked) {
          const genre = g.dataset.genre;
          words.push(...wordsData[genre]);
        }
      });
      shuffleWords();
    }

    /* シャッフル */
    function shuffleWords() {
      shuffled = [...words];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      index = 0;
      updateRemaining();
      currentWord.textContent = "---";
      countdownMessage.textContent = "";
    }

    function updateRemaining() {
      remainingCount.textContent = "残り：" + (shuffled.length - index);
    }

    /* 読み上げ */
    function speakWord(word) {
      const voice = settings.voice || "boy";

      if (audioPlayer) {
        audioPlayer.pause();
        audioPlayer.currentTime = 0;
      }

      currentWord.textContent = word;

      audioPlayer = new Audio(`sound/${voice}/${word.toLowerCase()}.mp3`);
      audioPlayer.play();

      audioPlayer.onplay = () => {
        isPlaying = true;
        startBtn.textContent = "🔊 読み上げ中";
      };

      audioPlayer.onended = () => {
        if (!autoPlay || isPaused) {
          isPlaying = false;
          startBtn.textContent = "▶ 読む";

          /* ★ 最後まで読んだときのメッセージ */
          if (index >= shuffled.length) {
            countdownMessage.textContent = "終わりました";
          }
        }
      };

      /* 自動再生 */
      if (autoPlay && !isPaused) {
        clearTimeout(autoPlayTimer);
        autoPlayTimer = setTimeout(() => {
          if (isPaused) return;
          if (index >= shuffled.length) {
            isPlaying = false;
            startBtn.textContent = "▶ 読む";
            countdownMessage.textContent = "終わりました";
            return;
          }
          const nextWord = shuffled[index];
          index++;
          updateRemaining();
          speakWord(nextWord);
        }, readInterval * 1000);
      }
    }

    /* 読むボタン（インターバル秒後に読む） */
    startBtn.addEventListener("click", () => {
      if (isPlaying) return;
      if (shuffled.length === 0) return;

      isPaused = false;
      pauseButton.style.background = "#ff9999";
      pauseButton.textContent = "⏹ 停止";

      let word;

      /* ★ 再開時も必ず次の単語を読む */
      word = shuffled[index];
      index++;
      updateRemaining();

      /* ★ カウントダウン表示（readInterval に連動） */
      clearInterval(countdownTimer);
      countdownMessage.textContent = readInterval;
      let count = readInterval;

      countdownTimer = setInterval(() => {
        count--;
        countdownMessage.textContent = count;

        if (count <= 0) {
          clearInterval(countdownTimer);
          countdownMessage.textContent = "";
        }
      }, 1000);

      clearTimeout(startDelayTimer);
      startDelayTimer = setTimeout(() => {
        speakWord(word);
      }, readInterval * 1000);
    });

    /* 停止ボタン（予約破棄） */
    pauseButton.addEventListener("click", () => {
      isPaused = true;

      if (audioPlayer && !audioPlayer.paused) {
        audioPlayer.pause();
        audioPlayer.currentTime = 0;
      }

      isPlaying = false;

      clearTimeout(startDelayTimer);
      clearTimeout(autoPlayTimer);
      clearInterval(countdownTimer);

      pauseButton.style.background = "#ff4444";
      pauseButton.textContent = "⏹ 停止中";
      startBtn.textContent = "▶ 再開";
    });

    /* シャッフル */
    shuffleResetBtn.addEventListener("click", () => {
      isPaused = true;

      clearTimeout(startDelayTimer);
      clearTimeout(autoPlayTimer);
      clearInterval(countdownTimer);

      loadWords();
      currentWord.textContent = "---";
      index = 0;
      startBtn.textContent = "▶ 読む";
      countdownMessage.textContent = "";
      isPlaying = false;
    });

    loadWords();

    /* 表示切替 */
    const toggleWordBtn = document.getElementById("toggleWordBtn");
    let wordVisible = true;

    toggleWordBtn.addEventListener("click", () => {
      wordVisible = !wordVisible;
      currentWord.style.visibility = wordVisible ? "visible" : "hidden";
      toggleWordBtn.textContent = wordVisible ? "👁 表示" : "👁 非表示";
    });
  </script>

</body>
</html>
