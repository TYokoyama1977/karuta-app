<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>イラスト集</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #fff; /* 背景は白 */
    color: #333;
    text-align: center;
  }

  /* ===== ヘッダー ===== */
  .illust-header {
    padding: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #f7f7f7;
    border-bottom: 2px solid #ccc;
  }

  .home-btn {
    font-size: 18px;
    padding: 8px 14px;
    border-radius: 8px;
    border: none;
    background: #eee;
    cursor: pointer;
  }

  h1 {
    margin: 16px 0 10px;
    font-size: 26px;
  }

  /* ===== カード型ボタンのグリッド ===== */
  .nav {
    max-width: 960px;
    margin: 0 auto;
    padding: 32px 16px 40px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
  }

  /* ===== カード型ボタン（あなたが提示したデザインを移植） ===== */
  .card-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    border-radius: 18px;
    border: 4px solid #333;
    background: #fff;
    text-decoration: none;
    color: #333;
    font-size: 1.2rem;
    box-shadow: 5px 5px 0 rgba(0,0,0,0.15);
    transition: transform 0.1s ease, box-shadow 0.1s ease;
    cursor: pointer;
  }

  .card-btn:hover {
    transform: translate(-3px, -3px);
    box-shadow: 7px 7px 0 rgba(0,0,0,0.2);
  }

  /* ===== カテゴリ別背景色（あなたの提示コードをそのまま使用） ===== */
  .animal { background: #fff7e0; }
  .color  { background: #ffe9ff; }
  .food   { background: #fff3e8; }
  .fruit  { background: #e9ffe9; }
  .body   { background: #e9f5ff; }
  .other  { background: #f5f0ff; }

  /* ===== 印刷ヘルプ ===== */
  .help-link {
    display: inline-flex;
    align-items: center;
    margin-top: 24px;
    padding: 12px 18px;
    border-radius: 999px;
    border: 3px solid #333;
    background: #fff;
    text-decoration: none;
    color: #333;
    font-size: 1rem;
    box-shadow: 4px 4px 0 rgba(0,0,0,0.15);
  }

  .help-link:hover {
    transform: translate(-2px, -2px);
    box-shadow: 6px 6px 0 rgba(0,0,0,0.2);
  }
</style>
</head>

<body>

<div class="illust-header">
  <button class="home-btn" onclick="goHome()">🏠 ホーム</button>
</div>

<h1>イラスト集</h1>

<div style="font-size:16px; margin-bottom:10px;">
  初期登録されている英単語のイラストを印刷することができます。
</div>

<!-- ▼ カード型ボタン一覧 ▼ -->
<div class="nav" id="nav"></div>

<a href="help-print.html" class="help-link">
  🖨️ 印刷方法のヘルプ
</a>

<script>
  function goHome() {
    window.location.href = "index.html";
  }

  const categories = ["Animal", "Color", "Food", "Fruit", "Body", "Other"];
  const nav = document.getElementById("nav");

  categories.forEach(key => {
    const btn = document.createElement("div");
    btn.textContent = key;
    btn.classList.add("card-btn");
    btn.classList.add(key.toLowerCase()); // カテゴリ色を適用

    btn.addEventListener("click", () => {
      window.location.href = `${key.toLowerCase()}-viewer.html`;
    });

    nav.appendChild(btn);
  });
</script>

</body>
</html>
