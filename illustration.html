<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>イラスト集</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: "Arial", sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
      background: #fff; /* ★背景を白に戻す */
    }

    .illust-header {
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f7f7f7;
      border-bottom: 2px solid #ccc;
    }

    .home-btn {
      font-size: 18px;
      padding: 8px 14px;
      border-radius: 8px;
      border: none;
      background: #eee;
      cursor: pointer;
    }

    h1 {
      margin: 16px 0 10px;
      font-size: 26px;
    }

    .nav {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      max-width: 600px;
      margin: 20px auto;
      padding: 0 16px;
    }

    .nav button {
      padding: 14px;
      border-radius: 12px;
      border: 3px solid #333;
      cursor: pointer;
      font-size: 16px;
      background: #fff; /* ★背景白に統一 */
      transition: 0.1s;
    }

    .nav button:hover {
      transform: translate(-2px, -2px);
      box-shadow: 4px 4px 0 rgba(0,0,0,0.2);
    }

    /* ★カテゴリ別のパステル色（ボタン背景ではなく枠線に使用） */
    .animal { border-color: #ffcc80; }
    .color  { border-color: #ff99cc; }
    .food   { border-color: #ffddaa; }
    .fruit  { border-color: #a8e6a3; }
    .body   { border-color: #a3d4ff; }
    .other  { border-color: #d6c8ff; }

    .help-link {
      margin-top: 20px;
      font-size: 16px;
      text-decoration: underline;
      cursor: pointer;
      display: inline-block;
    }
  </style>
</head>
<body>

  <div class="illust-header">
    <button class="home-btn" onclick="goHome()">🏠 ホーム</button>
  </div>

  <h1>イラスト集</h1>

  <div style="font-size:16px; margin-bottom:10px;">
    初期登録されている英単語のイラストを印刷することができます。
  </div>

  <div class="nav" id="nav"></div>

  <a href="help-print.html" class="help-link">
    印刷方法のヘルプ
  </a>

  <script>
    function goHome() {
      window.location.href = "index.html";
    }

    /* ▼ カテゴリ名だけを表示する簡潔版 ▼ */
    const categories = ["Animal", "Color", "Food", "Fruit", "Body", "Other"];

    const nav = document.getElementById("nav");

    categories.forEach(key => {
      const btn = document.createElement("button");
      btn.textContent = key;

      /* ▼ カテゴリ別の色クラスを付与 ▼ */
      btn.classList.add(key.toLowerCase());

      btn.addEventListener("click", () => {
        window.location.href = `${key.toLowerCase()}-viewer.html`;
      });

      nav.appendChild(btn);
    });
  </script>

</body>
</html>
